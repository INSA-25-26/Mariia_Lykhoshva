[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "pipeline_project"
version = "0.1.0"
dependencies = [
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.1,<3.0",
    "joblib>=1.3,<2.0",
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0"
]
requires-python = ">=3.11"
authors = [
    { name = "Mariia Lykhoshva" },
]
description = "Income predictor"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/INSA-25-26/Mariia_Lykhoshva"
Repository = "https://github.com/INSA-25-26/Mariia_Lykhoshva.git"
"Bug Tracker" = "https://github.com/INSA-25-26/Mariia_Lykhoshva/issues"

[tool.hatch.build]
artifacts = ["models/*.pkl"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_project"]