---
- name: Deploy pipeline project stack on AWS EC2
  hosts: app
  become: true
  vars:
    app_dir: /opt/pipeline-project
    repo_url: https://github.com/INSA-25-26/Mariia_Lykhoshva.git
    repo_version: main
    app_image: "{{ lookup('env', 'APP_IMAGE') | default('docker.io/library/pipeline-project:latest', true) }}"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default('admin123', true) }}"
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install base utilities
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
        state: present

    - name: Install Docker and compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Clone repository with deployment files
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}/repo"
        version: "{{ repo_version }}"
        force: true

    - name: Write runtime environment file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/repo/.env"
        content: |
          APP_IMAGE={{ app_image }}
          GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password }}
        mode: "0600"

    - name: Pull application image
      ansible.builtin.command: docker pull {{ app_image }}
      register: docker_pull_result
      changed_when: "'Downloaded newer image' in docker_pull_result.stderr or 'Status: Downloaded' in docker_pull_result.stdout"

    - name: Start the monitoring and app stack
      ansible.builtin.shell: |
        docker compose -f docker-compose.prod.yml down --remove-orphans || true
        docker compose -f docker-compose.prod.yml up -d
      args:
        chdir: "{{ app_dir }}/repo"
      environment:
        APP_IMAGE: "{{ app_image }}"
        GRAFANA_ADMIN_PASSWORD: "{{ grafana_admin_password }}"

    - name: Wait for application health endpoint
      ansible.builtin.uri:
        url: http://localhost:8000/health
        status_code: 200
      register: health_result
      retries: 20
      delay: 3
      until: health_result.status == 200

    - name: Wait for Prometheus
      ansible.builtin.uri:
        url: http://localhost:9090/-/healthy
        status_code: 200
      register: prometheus_result
      retries: 20
      delay: 3
      until: prometheus_result.status == 200

    - name: Wait for Grafana
      ansible.builtin.uri:
        url: http://localhost:3000/login
        status_code: 200
      register: grafana_result
      retries: 20
      delay: 3
      until: grafana_result.status == 200
