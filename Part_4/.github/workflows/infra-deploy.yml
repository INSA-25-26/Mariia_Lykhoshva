name: Provision VM and Deploy Service

on:
  workflow_dispatch:
    inputs:
      azure_location:
        description: Azure region for VM
        type: string
        required: true
        default: westeurope
      vm_size:
        description: Azure VM size
        type: string
        required: true
        default: Standard_B1s
      app_cidr:
        description: CIDR allowed for app/metrics ports
        type: string
        required: true
        default: 0.0.0.0/0
      ssh_cidr:
        description: CIDR allowed for SSH
        type: string
        required: true
        default: 0.0.0.0/0

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Write SSH keys
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          printf "%s\n" "${{ secrets.AZURE_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/pipeline-project"
          printf "%s\n" "${{ secrets.AZURE_SSH_PUBLIC_KEY }}" > "$HOME/.ssh/pipeline-project.pub"
          chmod 600 "$HOME/.ssh/pipeline-project"
          chmod 644 "$HOME/.ssh/pipeline-project.pub"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var "subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var "azure_location=${{ inputs.azure_location }}" \
            -var "vm_size=${{ inputs.vm_size }}" \
            -var "public_key_path=$HOME/.ssh/pipeline-project.pub" \
            -var "private_key_path=$HOME/.ssh/pipeline-project" \
            -var 'app_cidr_blocks=["${{ inputs.app_cidr }}"]' \
            -var 'ssh_cidr_blocks=["${{ inputs.ssh_cidr }}"]'

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Deploy stack with Ansible
        shell: bash
        run: |
          INSTANCE_IP=$(terraform -chdir=infra/terraform output -raw instance_public_ip)
          ansible-playbook \
            -i "${INSTANCE_IP}," \
            -u azureuser \
            --private-key "$HOME/.ssh/pipeline-project" \
            --ssh-common-args='-o StrictHostKeyChecking=no' \
            infra/ansible/playbook.yml \
            --extra-vars "repo_url=https://github.com/${GITHUB_REPOSITORY}.git repo_version=${GITHUB_REF_NAME} grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}"

      - name: Print service URLs
        shell: bash
        run: |
          APP_URL=$(terraform -chdir=infra/terraform output -raw application_url)
          GRAFANA_URL=$(terraform -chdir=infra/terraform output -raw grafana_url)
          PROMETHEUS_URL=$(terraform -chdir=infra/terraform output -raw prometheus_url)
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "GRAFANA_URL=$GRAFANA_URL" >> "$GITHUB_ENV"
          echo "PROMETHEUS_URL=$PROMETHEUS_URL" >> "$GITHUB_ENV"
          echo "Application: $APP_URL"
          echo "Grafana: $GRAFANA_URL"
          echo "Prometheus: $PROMETHEUS_URL"
